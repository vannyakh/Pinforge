name: Bug Report
description: Report a bug or unexpected behavior in Pinforge
title: '[Bug]: '
labels: ['bug']
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which area does this issue belong to?
      options:
        - Desktop UI
        - Downloads & Tasks
        - Providers — Pinterest
        - Providers — YouTube
        - Providers — Instagram
        - Providers — TikTok
        - Providers — Facebook
        - Enhance (sharp)
        - Settings & Updates
        - CLI
        - Core / packages
        - Packaging / Build
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
        - CLI only
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Pinforge Version
      description: App or package version (apps/desktop package.json or About dialog)
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Paste URL '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Logs, screenshots, sample URLs (public only), etc.
