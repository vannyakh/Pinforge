name: GPT PR Checks

on:
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: gpt-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  gpt-review:
    name: GPT Review
    if: vars.ENABLE_GPT_REVIEW == 'true'
    uses: ./.github/workflows/gpt-review.yml
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}

  gpt-assessment:
    name: GPT PR Assessment
    if: >
      vars.ENABLE_GPT_REVIEW == 'true' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER'
    uses: ./.github/workflows/gpt-pr-assessment.yml
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}
