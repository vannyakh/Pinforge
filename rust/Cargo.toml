[workspace]
resolver = "2"
members = [
  "crates/bridge",
  "crates/enhance",
  "crates/download",
  "crates/engine",
  "crates/settings",
  "crates/providers",
  "crates/features",
  "crates/remote",
  "crates/server",
  "crates/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pinforge"]

[workspace.dependencies]
bridge = { path = "crates/bridge" }
enhance = { path = "crates/enhance" }
download = { path = "crates/download" }
pinforge-engine = { path = "crates/engine" }
pinforge-settings = { path = "crates/settings" }
pinforge-providers = { path = "crates/providers" }
pinforge-features = { path = "crates/features" }
pinforge-remote = { path = "crates/remote" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "process", "io-std", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
tracing = "0.1"
