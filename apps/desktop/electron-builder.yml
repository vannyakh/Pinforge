appId: com.pinterestdesktop.app
productName: Pinforge
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
  - "**/sharp/**"
  - "**/@img/**"
win:
  icon: resources/icon.png
  target:
    - nsis
  artifactName: ${productName}-${version}-Setup.${ext}
mac:
  icon: resources/icon.png
  # zip is required for electron-updater on macOS
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  icon: resources/icon.png
  target:
    - AppImage
  artifactName: ${productName}-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
publish:
  provider: github
  owner: vannyakh
  repo: Pinforge
  publishAutoUpdate: true
