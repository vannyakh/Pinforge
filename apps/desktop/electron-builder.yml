appId: com.pinterestdesktop.app
productName: Pinforge
executableName: Pinforge
copyright: Copyright © Pinforge

asar:
  smartUnpack: true

directories:
  output: release
  buildResources: resources

# Exclude-style patterns so electron-builder still packs production node_modules
# (pnpm). Do not whitelist individual packages — that drops transitive deps like conf.
files:
  - out/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*/{*.test.js,*.spec.js,*.test.ts,*.spec.ts}"
  - "!**/node_modules/.bin"
  - "!**/*.{map,md}"
  - "!src/**"
  - "!electron.vite.config.*"
  - "!uno.config.*"
  - "!tsconfig*.json"
  - "!release/**"
  - "!resources/**"

extraResources:
  - from: resources/thumbnails
    to: thumbnails
    filter:
      - "**/*"

asarUnpack:
  - "**/*.node"
  - "**/sharp/**"
  - "**/@img/**"
  - "**/detect-libc/**"
  - "**/playwright/**"
  - "**/playwright-core/**"

afterPack: ../../scripts/afterPack.js
afterSign: ../../scripts/afterSign.js

npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false
compression: normal
removePackageScripts: true

win:
  icon: icon.png
  target:
    - nsis
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}

mac:
  # zip is required for electron-updater on macOS
  icon: icon.png
  target:
    - dmg
    - zip
  category: public.app-category.photography
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  # Omit explicit background path so electron-builder picks
  # resources/background.tiff (then .png) from buildResources.
  # dmg-builder is patched to skip corrupt pBBk bookmarks (electron-builder#9072).
  format: UDZO
  internetEnabled: false
  title: ${productName} ${version}
  icon: icon.png
  iconSize: 96
  window:
    width: 540
    height: 380
    x: 200
    y: 120
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

linux:
  icon: icon.png
  target:
    - AppImage
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  differentialPackage: false

publish:
  provider: github
  owner: vannyakh
  repo: Pinforge
  publishAutoUpdate: true
