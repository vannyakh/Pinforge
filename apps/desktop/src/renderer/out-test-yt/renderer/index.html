<!doctype html>
<html data-theme="dark" data-color-scheme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="Pinforge" />
    <meta name="theme-color" content="#0e0e0e" />
    <title>Pinforge</title>
    <script>
      (function () {
        try {
          var appearance = localStorage.getItem("__aionui_theme");
          if (appearance === "light" || appearance === "dark") {
            document.documentElement.setAttribute("data-theme", appearance);
          }
          var scale = localStorage.getItem("__aionui_ui_scale");
          if (scale) {
            var n = Number(scale);
            if (n >= 80 && n <= 120) {
              document.documentElement.style.fontSize = (16 * n) / 100 + "px";
              document.documentElement.setAttribute("data-ui-scale", String(n));
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BvvEUBBH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BVjYpelm.css">
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem("__aionui_theme");
        if (t) document.body.setAttribute("arco-theme", t);
      } catch (e) {}
    </script>
    <div id="root"></div>
  </body>
</html>
