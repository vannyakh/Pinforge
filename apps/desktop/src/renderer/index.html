<!doctype html>
<html class="splash-shell" data-theme="light" data-color-scheme="default" data-ui-scale="95">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="Pinforge" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Pinforge</title>
    <script>
      (function () {
        try {
          var themeId = localStorage.getItem("__aionui_theme_id");
          var stored = localStorage.getItem("__aionui_theme");
          var systemDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var appearance;
          // Default / Follow System → OS preference; else use stored resolved appearance.
          if (!themeId || themeId === "system") {
            appearance = systemDark ? "dark" : "light";
          } else if (stored === "light" || stored === "dark") {
            appearance = stored;
          } else if (themeId === "light" || themeId === "dark") {
            appearance = themeId;
          } else {
            appearance = systemDark ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", appearance);

          var scaleRaw = localStorage.getItem("__aionui_ui_scale");
          var factor = 0.95;
          if (scaleRaw) {
            var n = Number(scaleRaw);
            if (Number.isFinite(n)) {
              // Legacy percent (80–120) → factor; else treat as factor (0.8–1.3)
              factor = n > 3 ? n / 100 : n;
            }
          }
          if (factor < 0.8) factor = 0.8;
          if (factor > 1.3) factor = 1.3;
          factor = Math.round(factor * 100) / 100;
          document.documentElement.style.zoom = String(factor);
          document.documentElement.style.setProperty("--ui-scale", String(factor));
          document.documentElement.setAttribute("data-ui-scale", String(Math.round(factor * 100)));

          var sizesRaw = localStorage.getItem("__aionui_font_sizes");
          if (sizesRaw) {
            var sizes = JSON.parse(sizesRaw);
            if (sizes && typeof sizes === "object") {
              if (typeof sizes.chat === "number") {
                document.documentElement.style.setProperty("--chat-font-size", sizes.chat + "px");
              }
              if (typeof sizes.markdown === "number") {
                document.documentElement.style.setProperty("--md-font-size", sizes.markdown + "px");
              }
              if (typeof sizes.code === "number") {
                document.documentElement.style.setProperty("--code-font-size", sizes.code + "px");
              }
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Critical paint before Vite CSS — splash-shaped so first frame isn’t broken. */
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }
      .boot-splash {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #121212;
        border-radius: 16px;
        color: #86909c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
      }
      .boot-splash__mark {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        background: #1e1e1e;
      }
      .boot-splash__name {
        font-size: 22px;
        font-weight: 700;
        color: #f2f3f5;
        letter-spacing: -0.02em;
      }
      .boot-splash__label {
        font-size: 13px;
      }
    </style>
  </head>
  <body class="splash-shell">
    <script>
      try {
        var themeId = localStorage.getItem("__aionui_theme_id");
        var stored = localStorage.getItem("__aionui_theme");
        var systemDark =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var t;
        if (!themeId || themeId === "system") {
          t = systemDark ? "dark" : "light";
        } else if (stored === "light" || stored === "dark") {
          t = stored;
        } else if (themeId === "light" || themeId === "dark") {
          t = themeId;
        } else {
          t = systemDark ? "dark" : "light";
        }
        document.body.setAttribute("arco-theme", t);
      } catch (e) {
        var dark =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.body.setAttribute("arco-theme", dark ? "dark" : "light");
      }
    </script>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-splash__mark"></div>
        <div class="boot-splash__name">Pinforge</div>
        <div class="boot-splash__label">Loading…</div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
